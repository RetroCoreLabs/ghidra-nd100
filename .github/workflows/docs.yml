name: Docs site on GitHub Pages

# Builds the documentation site (MkDocs + Material) and publishes it at
# https://retrocorelabs.github.io/ghidra-nd100/. Site only: no plugin build, no release.
# The pages are generated by src/docs-site/gen_site.py; see its header.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r src/docs-site/requirements.txt
      - run: python src/eng/check-docs.py .
      - run: python src/docs-site/gen_site.py "${{ runner.temp }}/sitesrc"
      - run: mkdocs build --strict -f "${{ runner.temp }}/sitesrc/mkdocs.yml" -d "${{ runner.temp }}/site"
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
